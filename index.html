<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toddler Learning Academy</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2F2F2F;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            background: white;
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
            height: 85vh;
            border: 8px solid var(--accent);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hidden { display: none !important; }

        /* Main Menu */
        .menu-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .menu-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px #38b2ac;
        }

        /* Spelling & Phonics Styles */
        .big-emoji { font-size: 6rem; margin: 10px 0; display: block; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .word-display { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .slot {
            width: 50px; height: 60px; border-bottom: 5px solid #ddd;
            font-size: 2.5rem; font-weight: bold; color: var(--secondary);
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .hint-letter { color: rgba(0,0,0,0.05); position: absolute; }

        .keyboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(40px, 1fr)); gap: 5px; margin-top: auto; }
        .key { padding: 12px 5px; background: #eee; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Tracing Styles */
        #tracing-area {
            flex-grow: 1;
            position: relative;
            background: #fff;
            border: 3px dashed #ccc;
            border-radius: 20px;
            margin: 15px 0;
        }
        #trace-canvas { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 5; }
        #dotted-guide {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 20rem; font-family: Arial, sans-serif; font-weight: bold;
            color: white; text-shadow: 0 0 2px #ccc, 0 0 2px #ccc;
            letter-spacing: 5px; opacity: 0.3;
            user-select: none; z-index: 1;
            /* Dotted effect simulating simple letters */
            background-image: radial-gradient(#ccc 20%, transparent 20%);
            background-position: 0 0;
            background-size: 10px 10px;
            -webkit-background-clip: text;
        }

        #message { font-size: 1.5rem; color: var(--primary); font-weight: bold; height: 1.8rem; margin-bottom: 5px; }
        .btn-row { display: flex; justify-content: center; gap: 10px; padding: 10px; }
        .nav-btn { background: #999; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Home Menu -->
    <div id="menu">
        <h1 style="color:var(--primary)">🏠 Kids Play Lab</h1>
        <div class="menu-grid">
            <button class="menu-btn" onclick="startApp('phonics')">🍎 Letter Sounds (Input)</button>
            <button class="menu-btn" style="background:var(--primary); box-shadow:0 6px #d45656" onclick="startApp('spelling')">🐝 Spelling Bee (Input)</button>
            <button class="menu-btn" style="background:var(--accent); color:#333; box-shadow:0 6px #e6ce57" onclick="startApp('tracing')">✏️ Trace Letters (Draw)</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden" style="display:flex; flex-direction:column; height:100%">
        <div id="message"></div>

        <!-- Mode: Spelling/Phonics -->
        <div id="input-mode-ui" class="hidden">
            <div id="emoji-box" class="big-emoji"></div>
            <div id="slots-box" class="word-display"></div>
            <div id="kb-box" class="keyboard"></div>
        </div>

        <!-- Mode: Tracing -->
        <div id="tracing-mode-ui" class="hidden" style="flex-grow:1; display:flex; flex-direction:column;">
            <div id="tracing-area">
                <div id="dotted-guide">A</div>
                <canvas id="trace-canvas"></canvas>
            </div>
            <button class="menu-btn" style="background:var(--secondary); margin-bottom:10px" onclick="nextTracingLetter()">Next Letter! ✨</button>
        </div>

        <div class="btn-row">
            <button class="nav-btn" onclick="location.reload()">Home</button>
            <button class="nav-btn" style="background:var(--primary)" id="clear-btn" onclick="clearDraw()">Clear</button>
        </div>
    </div>
</div>

<script>
    const words = [
        {w: 'CAT', e: '🐱'}, {w: 'DOG', e: '🐶'}, {w: 'SUN', e: '☀️'}, 
        {w: 'BED', e: '🛏️'}, {w: 'BOX', e: '📦'}, {w: 'FISH', e: '🐟'}
    ];

    let currentMode = '';
    let currentIdx = 0;
    let traceIdx = 0;
    let revealedLetters = [];

    const canvas = document.getElementById('trace-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let lastX = 0; let lastY = 0;

    const synth = window.speechSynthesis;
    function speak(t) { if(synth.speaking) synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate=0.9; synth.speak(u); }

    function startApp(mode) {
        currentMode = mode;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        if(mode === 'tracing') {
            document.getElementById('tracing-mode-ui').classList.remove('hidden');
            document.getElementById('clear-btn').classList.remove('hidden');
            resizeCanvas();
            loadTraceLetter();
        } else {
            document.getElementById('input-mode-ui').classList.remove('hidden');
            document.getElementById('clear-btn').classList.add('hidden');
            loadInputLevel();
            buildKeyboard();
        }
    }

    // --- SPELLING & PHONICS LOGIC ---
    function loadInputLevel() {
        const data = words[currentIdx];
        revealedLetters = [];
        document.getElementById('emoji-box').innerText = data.e;
        const sBox = document.getElementById('slots-box');
        sBox.innerHTML = '';
        
        if(currentMode === 'phonics') {
            document.getElementById('message').innerText = `Find the start letter!`;
            speak(`Find the letter ${data.w[0]} for ${data.w}`);
            createSlot(data.w[0], 0);
        } else {
            document.getElementById('message').innerText = `Spell the word!`;
            speak(`How do you spell ${data.w}?`);
            data.w.split('').forEach((l, i) => createSlot(l, i));
        }
    }

    function createSlot(char, i) {
        const s = document.createElement('div');
        s.className = 'slot';
        s.id = 'slot-' + i;
        s.innerHTML = `<span class="hint-letter">${char}</span><span class="fill hidden" style="color:var(--secondary)">${char}</span>`;
        s.onclick = () => handleInput(char);
        document.getElementById('slots-box').appendChild(s);
    }

    function buildKeyboard() {
        const box = document.getElementById('kb-box');
        box.innerHTML = '';
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
            const b = document.createElement('button');
            b.className = 'key';
            b.innerText = l;
            b.onclick = () => handleInput(l);
            box.appendChild(b);
        });
    }

    function handleInput(l) {
        const word = words[currentIdx].w;
        if(currentMode === 'phonics') {
            if(l === word[0]) { reveal(0); winLevel(); }
            else speak("Try again!");
        } else {
            let found = false;
            word.split('').forEach((char, i) => {
                if(char === l && !revealedLetters.includes(i)) {
                    reveal(i);
                    found = true;
                    if(revealedLetters.length === word.length) winLevel();
                }
            });
            if(found) speak(l);
        }
    }

    function reveal(i) {
        const slot = document.getElementById('slot-' + i);
        if(slot) {
            slot.querySelector('.fill').classList.remove('hidden');
            revealedLetters.push(i);
        }
    }

    function winLevel() {
        speak("Great job!");
        document.getElementById('message').innerText = "🌟 YOU GOT IT! 🌟";
        setTimeout(() => {
            currentIdx = (currentIdx + 1) % words.length;
            loadInputLevel();
        }, 2000);
    }

    // --- TRACING LOGIC ---
    function loadTraceLetter() {
        const l = String.fromCharCode(65 + traceIdx);
        document.getElementById('dotted-guide').innerText = l;
        document.getElementById('message').innerText = `Trace the letter ${l}`;
        speak(`Trace the letter ${l}`);
        clearDraw();
    }

    function nextTracingLetter() {
        traceIdx = (traceIdx + 1) % 26;
        loadTraceLetter();
    }

    function resizeCanvas() {
        const area = document.getElementById('tracing-area');
        canvas.width = area.clientWidth;
        canvas.height = area.clientHeight;
    }

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
        const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
        return {x, y};
    }

    function startDraw(e) { 
        isDrawing = true; 
        const {x, y} = getCoords(e);
        lastX = x; lastY = y;
    }

    function drawing(e) {
        if(!isDrawing) return;
        const {x, y} = getCoords(e);
        
        // Simple snapping/smoothing: draw thick round lines
        ctx.strokeStyle = '#4ECDC4';
        ctx.lineWidth = 25;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        
        lastX = x; lastY = y;
    }

    function stopDraw() { isDrawing = false; }
    function clearDraw() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', drawing);
    window.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', drawing);
    canvas.addEventListener('touchend', stopDraw);

    // Keyboard support for spelling
    window.addEventListener('keydown', (e) => {
        const k = e.key.toUpperCase();
        if(/^[A-Z]$/.test(k) && currentMode !== 'tracing') handleInput(k);
    });

</script>
</body>
</html>
