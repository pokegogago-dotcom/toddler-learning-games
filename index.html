<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toddler Reading Academy</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2F2F2F;
            --hint: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: manipulation;
            overflow: hidden;
        }

        #game-container {
            background: white;
            padding: 20px;
            border-radius: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 800px;
            border: 10px solid var(--accent);
            position: relative;
        }

        .hidden { display: none !important; }

        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 10px; }

        /* Menu Styles */
        .menu-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 20px 30px;
            border-radius: 20px;
            font-size: 1.5rem;
            margin: 10px;
            cursor: pointer;
            display: block;
            width: 100%;
            box-shadow: 0 6px #38b2ac;
            transition: 0.2s;
        }
        .menu-btn:active { transform: translateY(4px); box-shadow: 0 2px #38b2ac; }

        /* Game Elements */
        .big-emoji {
            font-size: 8rem;
            margin: 10px 0;
            display: block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .word-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .letter-slot {
            width: 60px;
            height: 80px;
            border-bottom: 5px solid #eee;
            position: relative;
            font-size: 3.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .hint-letter {
            color: var(--hint);
            position: absolute;
            pointer-events: none;
            text-transform: uppercase;
        }

        .filled-letter {
            color: var(--secondary);
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
        }

        .is-filled .filled-letter { transform: scale(1); }
        .is-filled { border-bottom-color: var(--secondary); }

        /* Keyboard */
        .keyboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(45px, 1fr));
            gap: 8px;
            margin-top: 20px;
        }

        .key {
            background: #f0f0f0;
            border: 2px solid #ddd;
            padding: 15px 5px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .key.correct { background: var(--secondary); color: white; border-color: #38b2ac; }

        #message {
            font-size: 1.5rem;
            height: 2rem;
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-fill { height: 100%; width: 0%; background: var(--secondary); transition: 0.5s; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Main Menu -->
        <div id="menu">
            <h1>🎒 Kiddo Learning</h1>
            <button class="menu-btn" onclick="initGame('phonics')">1. Letter Sounds (Easy) 🍎</button>
            <button class="menu-btn" style="background: var(--primary); box-shadow: 0 6px #d14d4d;" onclick="initGame('spelling')">2. Spell the Word (Hard) ✍️</button>
        </div>

        <!-- Game Interface -->
        <div id="game-play" class="hidden">
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <div id="message"></div>
            <div id="emoji-display" class="big-emoji"></div>
            <div id="word-slots" class="word-container"></div>
            <div id="keyboard" class="keyboard"></div>
            
            <button onclick="location.reload()" style="margin-top:20px; background:none; border:none; color:#999; cursor:pointer;">🏠 Back to Menu</button>
        </div>
    </div>

    <script>
        const words = [
            { w: 'DOG', e: '🐶', s: 'D' },
            { w: 'CAT', e: '🐱', s: 'C' },
            { w: 'SUN', e: '☀️', s: 'S' },
            { w: 'BED', e: '🛏️', s: 'B' },
            { w: 'FISH', e: '🐟', s: 'F' },
            { w: 'BALL', e: '⚽', s: 'B' },
            { w: 'DUCK', e: '🦆', s: 'D' },
            { w: 'FROG', e: '🐸', s: 'F' },
            { w: 'APPLE', e: '🍎', s: 'A' },
            { w: 'HOUSE', e: '🏠', s: 'H' }
        ];

        let gameMode = ''; // 'spelling' or 'phonics'
        let currentIndex = 0;
        let revealedIndices = [];
        const synth = window.speechSynthesis;

        function speak(text) {
            if (synth.speaking) synth.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 0.8;
            synth.speak(u);
        }

        function initGame(mode) {
            gameMode = mode;
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game-play').classList.remove('hidden');
            currentIndex = 0;
            loadStage();
            renderKeyboard();
        }

        function renderKeyboard() {
            const kb = document.getElementById('keyboard');
            kb.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
                const b = document.createElement('button');
                b.className = 'key';
                b.innerText = l;
                b.onclick = () => handleInput(l);
                kb.appendChild(b);
            });
        }

        function loadStage() {
            const data = words[currentIndex];
            revealedIndices = [];
            const container = document.getElementById('word-slots');
            container.innerHTML = '';
            
            document.getElementById('emoji-display').innerText = data.e;
            document.getElementById('progress-fill').style.width = (currentIndex / words.length * 100) + '%';

            if (gameMode === 'phonics') {
                document.getElementById('message').innerText = `Find the letter "${data.s}"`;
                speak(`${data.s} is for ${data.w}. Can you find the letter ${data.s}?`);
                
                // Show only the first letter as a hint
                createSlot(data.s, 0);
            } else {
                document.getElementById('message').innerText = "Spell the word!";
                speak(`How do you spell ${data.w}?`);
                
                // Show all letters as faint hints
                data.w.split('').forEach((char, i) => createSlot(char, i));
            }
        }

        function createSlot(char, index) {
            const container = document.getElementById('word-slots');
            const div = document.createElement('div');
            div.className = 'letter-slot';
            div.id = `slot-${index}`;
            div.innerHTML = `<span class="hint-letter">${char}</span><span class="filled-letter">${char}</span>`;
            div.onclick = () => handleInput(char); // Clicking the hint works too!
            container.appendChild(div);
        }

        function handleInput(letter) {
            const data = words[currentIndex];
            
            if (gameMode === 'phonics') {
                if (letter === data.s) {
                    revealSlot(0);
                    success();
                } else {
                    speak("Try again!");
                }
            } else {
                // Spelling mode logic
                let found = false;
                data.w.split('').forEach((char, i) => {
                    if (char === letter && !revealedIndices.includes(i)) {
                        revealSlot(i);
                        found = true;
                    }
                });

                if (found) {
                    speak(letter);
                    if (revealedIndices.length === data.w.length) {
                        success();
                    }
                } else {
                    speak("Not that one");
                }
            }
        }

        function revealSlot(index) {
            if (!revealedIndices.includes(index)) {
                const slot = document.getElementById(`slot-${index}`);
                if (slot) {
                    slot.classList.add('is-filled');
                    revealedIndices.push(index);
                }
            }
        }

        function success() {
            const data = words[currentIndex];
            document.getElementById('message').innerText = "🌟 GREAT JOB! 🌟";
            speak("You got it! " + data.w);
            
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < words.length) {
                    loadStage();
                } else {
                    finishGame();
                }
            }, 2500);
        }

        function finishGame() {
            document.getElementById('emoji-display').innerText = '🏆';
            document.getElementById('message').innerText = "YOU ARE A STAR!";
            document.getElementById('word-slots').innerHTML = "<h2>All Done!</h2>";
            speak("Congratulations! You finished all the words!");
            setTimeout(() => location.reload(), 5000);
        }

        // Listen for real keyboard
        window.addEventListener('keydown', (e) => {
            const k = e.key.toUpperCase();
            if (/^[A-Z]$/.test(k)) handleInput(k);
        });
    </script>
</body>
</html>
