<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toddler Learning Academy</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2F2F2F;
        }

        body {
            font-family: 'Comic Sans MS', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Critical for mobile */
        }

        #game-container {
            background: white;
            padding: 15px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 92%;
            max-width: 500px;
            height: 90vh;
            border: 8px solid var(--accent);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hidden { display: none !important; }

        /* Menu */
        .menu-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .menu-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px #38b2ac;
        }

        /* Spelling/Phonics UI */
        .big-emoji { font-size: 5rem; margin: 10px 0; }
        .word-display { display: flex; justify-content: center; gap: 8px; margin: 15px 0; }
        .slot {
            width: 45px; height: 55px; border-bottom: 4px solid #ddd;
            font-size: 2rem; font-weight: bold; color: var(--secondary);
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .hint-letter { color: rgba(0,0,0,0.06); position: absolute; }
        .keyboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(35px, 1fr)); gap: 4px; margin-top: auto; }
        .key { padding: 10px 2px; background: #eee; border: 1px solid #ccc; border-radius: 6px; font-weight: bold; }

        /* TRACING AREA ENHANCEMENTS */
        #tracing-area {
            flex-grow: 1;
            position: relative;
            background: #fff;
            border: 2px solid #eee;
            border-radius: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        #trace-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            touch-action: none;
        }

        /* High Visibility Dashed Guide */
        #guide-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22rem;
            font-family: Arial, sans-serif;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 4px #555; /* Thick dark dashed outline */
            stroke-dasharray: 20, 20; /* Creates the broken line effect */
            user-select: none;
            z-index: 1;
            opacity: 0.4;
        }

        #message { font-size: 1.3rem; color: var(--primary); font-weight: bold; margin-bottom: 5px; }
        
        .btn-row { display: flex; justify-content: center; gap: 10px; margin-top: 5px; }
        .nav-btn { background: #999; color: white; border: none; padding: 10px 15px; border-radius: 12px; cursor: pointer; }
        
        .next-btn {
            background: var(--secondary);
            color: white;
            padding: 15px;
            width: 100%;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            margin-bottom: 10px;
            box-shadow: 0 4px #38b2ac;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu">
        <h1 style="color:var(--primary); margin:0;">🌟 Fun Learning</h1>
        <div class="menu-grid">
            <button class="menu-btn" onclick="startApp('phonics')">🍎 Letter Sounds</button>
            <button class="menu-btn" style="background:var(--primary); box-shadow:0 5px #d45656" onclick="startApp('spelling')">🐝 Spelling Bee</button>
            <button class="menu-btn" style="background:#FFD93D; color:#333; box-shadow:0 5px #e6ce57" onclick="startApp('tracing')">✏️ Trace Letters (A-Z)</button>
        </div>
    </div>

    <div id="game-screen" class="hidden" style="display:flex; flex-direction:column; height:100%">
        <div id="message"></div>

        <div id="input-mode-ui" class="hidden">
            <div id="emoji-box" class="big-emoji"></div>
            <div id="slots-box" class="word-display"></div>
            <div id="kb-box" class="keyboard"></div>
        </div>

        <div id="tracing-mode-ui" class="hidden" style="flex-grow:1; display:flex; flex-direction:column;">
            <div id="tracing-area">
                <div id="guide-text">A</div>
                <canvas id="trace-canvas"></canvas>
            </div>
            <button class="next-btn" onclick="nextTrace()">Next Letter! ✨</button>
        </div>

        <div class="btn-row">
            <button class="nav-btn" onclick="location.reload()">Home</button>
            <button class="nav-btn" style="background:var(--primary)" onclick="clearCanvas()">Clear</button>
        </div>
    </div>
</div>

<script>
    const words = [
        {w: 'CAT', e: '🐱'}, {w: 'DOG', e: '🐶'}, {w: 'SUN', e: '☀️'}, 
        {w: 'BED', e: '🛏️'}, {w: 'FISH', e: '🐟'}
    ];

    let currentMode = '';
    let wordIdx = 0;
    let traceIdx = 0;
    const synth = window.speechSynthesis;
    const canvas = document.getElementById('trace-canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function speak(t) { if(synth.speaking) synth.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate=0.9; synth.speak(u); }

    function startApp(mode) {
        currentMode = mode;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        if(mode === 'tracing') {
            document.getElementById('tracing-mode-ui').classList.remove('hidden');
            resizeCanvas();
            loadTrace();
        } else {
            document.getElementById('input-mode-ui').classList.remove('hidden');
            loadInput();
        }
    }

    // --- INPUT MODES ---
    function loadInput() {
        const data = words[wordIdx];
        document.getElementById('emoji-box').innerText = data.e;
        document.getElementById('slots-box').innerHTML = '';
        document.getElementById('message').innerText = currentMode === 'phonics' ? "Find the start letter!" : "Spell the word!";
        
        data.w.split('').forEach((l, i) => {
            if(currentMode === 'phonics' && i > 0) return;
            const s = document.createElement('div');
            s.className = 'slot';
            s.innerHTML = `<span class="hint-letter">${l}</span><span class="fill hidden">${l}</span>`;
            document.getElementById('slots-box').appendChild(s);
        });
        buildKB();
    }

    function buildKB() {
        const kb = document.getElementById('kb-box'); kb.innerHTML = '';
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
            const b = document.createElement('button');
            b.className = 'key'; b.innerText = l;
            b.onclick = () => {
                speak(l);
                const data = words[wordIdx].w;
                const slots = document.querySelectorAll('.slot');
                let filled = false;
                slots.forEach(s => {
                    if(s.querySelector('.hint-letter').innerText === l && s.querySelector('.fill').classList.contains('hidden')) {
                        s.querySelector('.fill').classList.remove('hidden');
                        s.querySelector('.fill').style.color = 'var(--secondary)';
                        filled = true;
                    }
                });
                
                const allDone = Array.from(document.querySelectorAll('.fill')).every(f => !f.classList.contains('hidden'));
                if(allDone) {
                    speak("Great job!");
                    setTimeout(() => { wordIdx = (wordIdx + 1) % words.length; loadInput(); }, 1500);
                }
            };
            kb.appendChild(b);
        });
    }

    // --- TRACING ENGINE ---
    function resizeCanvas() {
        const area = document.getElementById('tracing-area');
        canvas.width = area.clientWidth;
        canvas.height = area.clientHeight;
    }

    function loadTrace() {
        const l = String.fromCharCode(65 + traceIdx);
        document.getElementById('guide-text').innerText = l;
        document.getElementById('message').innerText = `Trace the letter ${l}`;
        speak(`Trace the letter ${l}`);
        clearCanvas();
    }

    function nextTrace() {
        traceIdx = (traceIdx + 1) % 26;
        loadTrace();
    }

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    // SNAPPING LOGIC: Pulls the line toward the center of the guide
    function startDraw(e) { drawing = true; ctx.beginPath(); }
    
    function moveDraw(e) {
        if(!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        
        ctx.lineWidth = 22;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#4ECDC4';

        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', moveDraw);
    window.addEventListener('touchend', () => drawing = false);
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
</script>
</body>
</html>
