<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toddler Learning Academy</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2F2F2F;
            --snap-color: #FF5722;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            background: white;
            padding: 16px;
            border-radius: 30px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
            text-align: center;
            width: 94%;
            max-width: 520px;
            height: 94vh;
            border: 8px solid var(--accent);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hidden { display: none !important; }

        h1 { color: var(--primary); margin: 5px 0 10px 0; font-size: 2rem; }

        /* Menu */
        .menu-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 15px; }
        .menu-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 18px 20px;
            border-radius: 20px;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px #38b2ac;
            transition: transform 0.1s;
        }
        .menu-btn:active { transform: translateY(3px); box-shadow: 0 2px #38b2ac; }

        /* Spelling/Phonics UI */
        .big-emoji {
            font-size: 5.5rem;
            margin: 5px 0;
            display: inline-block;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .word-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .slot {
            width: 52px;
            height: 64px;
            border-bottom: 5px solid #ccc;
            font-size: 2.4rem;
            font-weight: 900;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .slot:hover { border-bottom-color: var(--secondary); }

        .hint-letter {
            color: rgba(0, 0, 0, 0.12);
            position: absolute;
            font-family: Arial, sans-serif;
            pointer-events: none;
        }

        .fill-letter {
            color: var(--secondary);
            font-family: Arial, sans-serif;
            transform: scale(0);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .slot.revealed .fill-letter { transform: scale(1); }
        .slot.revealed { border-bottom-color: var(--secondary); }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(36px, 1fr));
            gap: 4px;
            margin-top: auto;
            padding-bottom: 5px;
        }
        .key {
            padding: 12px 2px;
            background: #f1f3f5;
            border: 2px solid #dde1e5;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            box-shadow: 0 2px #c1c7cd;
        }
        .key:active { transform: translateY(2px); box-shadow: none; }

        /* TRACING AREA */
        #tracing-area {
            flex-grow: 1;
            position: relative;
            background: #fff;
            border: 3px dashed #bbb;
            border-radius: 20px;
            margin: 8px 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #trace-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        #trace-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            touch-action: none;
        }

        #message {
            font-size: 1.35rem;
            color: var(--primary);
            font-weight: bold;
            min-height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls { display: flex; justify-content: center; gap: 10px; margin-top: auto; }
        .nav-btn {
            background: #95a5a6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .action-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px #38b2ac;
            width: 100%;
            margin-bottom: 8px;
        }
        .action-btn:active { transform: translateY(2px); box-shadow: none; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Home Menu -->
    <div id="menu">
        <h1>🌟 Kids Learning Fun</h1>
        <div class="menu-grid">
            <button class="menu-btn" onclick="startMode('phonics')">🍎 Letter Sounds (Phonics)</button>
            <button class="menu-btn" style="background:var(--primary); box-shadow:0 5px #d45656" onclick="startMode('spelling')">🐝 Spelling Bee</button>
            <button class="menu-btn" style="background:#FFD93D; color:#333; box-shadow:0 5px #d8b41e" onclick="startMode('tracing')">✏️ Magic Letter Tracing (A-Z)</button>
        </div>
    </div>

    <!-- Gameplay Screen -->
    <div id="game-screen" class="hidden" style="display:flex; flex-direction:column; height:100%">
        <div id="message"></div>

        <!-- Spelling / Phonics UI -->
        <div id="input-ui" class="hidden" style="display:flex; flex-direction:column; flex-grow:1;">
            <div id="emoji-box" class="big-emoji"></div>
            <div id="slots-box" class="word-display"></div>
            <div id="kb-box" class="keyboard"></div>
        </div>

        <!-- Tracing UI -->
        <div id="tracing-ui" class="hidden" style="display:flex; flex-direction:column; flex-grow:1;">
            <div id="tracing-area">
                <svg id="trace-svg"></svg>
                <canvas id="trace-canvas"></canvas>
            </div>
            <button class="action-btn" onclick="nextTraceLetter()">Next Letter ➡️</button>
        </div>

        <div class="controls">
            <button class="nav-btn" onclick="goToMenu()">🏠 Menu</button>
            <button class="nav-btn" style="background:var(--primary)" id="clear-btn" onclick="clearTracingCanvas()">🧼 Clear</button>
        </div>
    </div>
</div>

<script>
    // --- WORDS DATABASE ---
    const words = [
        { w: 'DOG', e: '🐶' },
        { w: 'CAT', e: '🐱' },
        { w: 'SUN', e: '☀️' },
        { w: 'BED', e: '🛏️' },
        { w: 'FISH', e: '🐟' },
        { w: 'DUCK', e: '🦆' },
        { w: 'BALL', e: '⚽' },
        { w: 'APPLE', e: '🍎' },
        { w: 'FROG', e: '🐸' },
        { w: 'TREE', e: '🌳' }
    ];

    // --- STROKE DEFINITIONS FOR A-Z TRACING (Normalized 0-100 Coordinates) ---
    const letterPaths = {
        'A': [[{x:50,y:15},{x:20,y:85}], [{x:50,y:15},{x:80,y:85}], [{x:32,y:58},{x:68,y:58}]],
        'B': [[{x:30,y:15},{x:30,y:85}], [{x:30,y:15},{x:65,y:15},{x:65,y:50},{x:30,y:50}], [{x:30,y:50},{x:70,y:50},{x:70,y:85},{x:30,y:85}]],
        'C': [[{x:75,y:25},{x:40,y:15},{x:25,y:50},{x:40,y:85},{x:75,y:75}]],
        'D': [[{x:30,y:15},{x:30,y:85}], [{x:30,y:15},{x:75,y:50},{x:30,y:85}]],
        'E': [[{x:30,y:15},{x:30,y:85}], [{x:30,y:15},{x:75,y:15}], [{x:30,y:50},{x:65,y:50}], [{x:30,y:85},{x:75,y:85}]],
        'F': [[{x:30,y:15},{x:30,y:85}], [{x:30,y:15},{x:75,y:15}], [{x:30,y:50},{x:65,y:50}]],
        'G': [[{x:75,y:25},{x:40,y:15},{x:25,y:50},{x:40,y:85},{x:75,y:85},{x:75,y:52},{x:55,y:52}]],
        'H': [[{x:30,y:15},{x:30,y:85}], [{x:70,y:15},{x:70,y:85}], [{x:30,y:50},{x:70,y:50}]],
        'I': [[{x:50,y:15},{x:50,y:85}], [{x:35,y:15},{x:65,y:15}], [{x:35,y:85},{x:65,y:85}]],
        'J': [[{x:65,y:15},{x:65,y:70},{x:50,y:85},{x:30,y:75}]],
        'K': [[{x:30,y:15},{x:30,y:85}], [{x:70,y:20},{x:30,y:52}], [{x:30,y:52},{x:72,y:85}]],
        'L': [[{x:30,y:15},{x:30,y:85}], [{x:30,y:85},{x:75,y:85}]],
        'M': [[{x:25,y:85},{x:25,y:15}], [{x:25,y:15},{x:50,y:60}], [{x:50,y:60},{x:75,y:15}], [{x:75,y:15},{x:75,y:85}]],
        'N': [[{x:30,y:85},{x:30,y:15}], [{x:30,y:15},{x:70,y:85}], [{x:70,y:85},{x:70,y:15}]],
        'O': [[{x:50,y:15},{x:25,y:50},{x:50,y:85},{x:75,y:50},{x:50,y:15}]],
        'P': [[{x:30,y:15},{x:30,y:85}], [{x:30,y:15},{x:70,y:15},{x:70,y:50},{x:30,y:50}]],
        'Q': [[{x:50,y:15},{x:25,y:50},{x:50,y:85},{x:75,y:50},{x:50,y:15}], [{x:60,y:65},{x:78,y:85}]],
        'R': [[{x:30,y:15},{x:30,y:85}], [{x:30,y:15},{x:70,y:15},{x:70,y:50},{x:30,y:50}], [{x:48,y:50},{x:72,y:85}]],
        'S': [[{x:70,y:25},{x:45,y:15},{x:30,y:35},{x:70,y:65},{x:55,y:85},{x:30,y:75}]],
        'T': [[{x:50,y:15},{x:50,y:85}], [{x:25,y:15},{x:75,y:15}]],
        'U': [[{x:30,y:15},{x:30,y:68},{x:50,y:85},{x:70,y:68},{x:70,y:15}]],
        'V': [[{x:25,y:15},{x:50,y:85}], [{x:50,y:85},{x:75,y:15}]],
        'W': [[{x:20,y:15},{x:32,y:85}], [{x:32,y:85},{x:50,y:40}], [{x:50,y:40},{x:68,y:85}], [{x:68,y:85},{x:80,y:15}]],
        'X': [[{x:25,y:18},{x:75,y:82}], [{x:75,y:18},{x:25,y:82}]],
        'Y': [[{x:25,y:15},{x:50,y:50}], [{x:75,y:15},{x:50,y:50}], [{x:50,y:50},{x:50,y:85}]],
        'Z': [[{x:28,y:18},{x:72,y:18}], [{x:72,y:18},{x:28,y:82}], [{x:28,y:82},{x:72,y:82}]]
    };

    let currentMode = '';
    let wordIdx = 0;
    let traceIdx = 0;
    let revealedSlots = [];

    const synth = window.speechSynthesis;

    function speak(text, callback) {
        if (!synth) return;
        if (synth.speaking) synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 0.85;
        utter.pitch = 1.1;
        if (callback) utter.onend = callback;
        synth.speak(utter);
    }

    function goToMenu() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('menu').classList.remove('hidden');
        if (synth.speaking) synth.cancel();
    }

    function startMode(mode) {
        currentMode = mode;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        if (mode === 'tracing') {
            document.getElementById('input-ui').classList.add('hidden');
            document.getElementById('tracing-ui').classList.remove('hidden');
            document.getElementById('clear-btn').classList.remove('hidden');
            setupCanvas();
            loadTrace();
        } else {
            document.getElementById('tracing-ui').classList.add('hidden');
            document.getElementById('input-ui').classList.remove('hidden');
            document.getElementById('clear-btn').classList.add('hidden');
            wordIdx = 0;
            loadWordStage();
            buildKeyboard();
        }
    }

    // ==========================================
    // --- SPELLING & PHONICS ENGINE (VOICE+) ---
    // ==========================================
    function loadWordStage() {
        const item = words[wordIdx];
        revealedSlots = [];
        document.getElementById('emoji-box').innerText = item.e;
        const slotsBox = document.getElementById('slots-box');
        slotsBox.innerHTML = '';

        if (currentMode === 'phonics') {
            document.getElementById('message').innerText = `Find the starting letter!`;
            // Announce starting sound
            speak(`${item.w[0]} is for ${item.w}! Can you find the letter ${item.w[0]}?`);
            createSlot(item.w[0], 0);
        } else {
            document.getElementById('message').innerText = `Spell the word!`;
            // Announce full word
            speak(`Look, it's a ${item.w}! Can you spell ${item.w}?`);
            item.w.split('').forEach((char, idx) => createSlot(char, idx));
        }
    }

    function createSlot(letter, index) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.id = `slot-${index}`;
        slot.innerHTML = `
            <span class="hint-letter">${letter}</span>
            <span class="fill-letter">${letter}</span>
        `;
        // Tapping the faint hint helps the child
        slot.onclick = () => handleLetterInput(letter);
        document.getElementById('slots-box').appendChild(slot);
    }

    function buildKeyboard() {
        const kb = document.getElementById('kb-box');
        kb.innerHTML = '';
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(char => {
            const btn = document.createElement('button');
            btn.className = 'key';
            btn.innerText = char;
            btn.onclick = () => handleLetterInput(char);
            kb.appendChild(btn);
        });
    }

    function handleLetterInput(char) {
        const item = words[wordIdx];
        
        if (currentMode === 'phonics') {
            if (char === item.w[0]) {
                revealSlot(0);
                speak(`Great job! ${char} is for ${item.w}!`, () => {
                    advanceStage();
                });
            } else {
                speak(`Oops! Try looking for ${item.w[0]}`);
            }
        } else {
            // Spelling Bee Mode
            let found = false;
            item.w.split('').forEach((l, idx) => {
                if (l === char && !revealedSlots.includes(idx)) {
                    revealSlot(idx);
                    found = true;
                }
            });

            if (found) {
                speak(char);
                if (revealedSlots.length === item.w.length) {
                    // Spelled the entire word!
                    document.getElementById('message').innerText = `🎉 YOU DID IT! 🎉`;
                    const spelledSpaced = item.w.split('').join(' - ');
                    speak(`Awesome! ${spelledSpaced}, spells ${item.w}!`, () => {
                        advanceStage();
                    });
                }
            } else {
                speak(`Try again!`);
            }
        }
    }

    function revealSlot(index) {
        const slot = document.getElementById(`slot-${index}`);
        if (slot) {
            slot.classList.add('revealed');
            revealedSlots.push(index);
        }
    }

    function advanceStage() {
        setTimeout(() => {
            wordIdx = (wordIdx + 1) % words.length;
            loadWordStage();
        }, 1200);
    }

    // Listen to real physical keyboard
    window.addEventListener('keydown', (e) => {
        const k = e.key.toUpperCase();
        if (/^[A-Z]$/.test(k) && currentMode !== 'tracing') {
            handleLetterInput(k);
        }
    });

    // ===============================================
    // --- MAGIC SNAPPING & TRACING ENGINE ---
    // ===============================================
    const canvas = document.getElementById('trace-canvas');
    const ctx = canvas.getContext('2d');
    const svg = document.getElementById('trace-svg');
    let isDrawing = false;
    let currentStrokeSegments = [];

    function setupCanvas() {
        const area = document.getElementById('tracing-area');
        canvas.width = area.clientWidth;
        canvas.height = area.clientHeight;
        svg.setAttribute('viewBox', `0 0 ${area.clientWidth} ${area.clientHeight}`);
    }

    function loadTrace() {
        const letter = String.fromCharCode(65 + traceIdx);
        document.getElementById('message').innerText = `Trace the letter ${letter}`;
        speak(`Let's trace the letter ${letter}! Follow the dotted lines.`);

        renderDashedSVGGuide(letter);
        clearTracingCanvas();
    }

    function nextTraceLetter() {
        traceIdx = (traceIdx + 1) % 26;
        loadTrace();
    }

    function clearTracingCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Render high-contrast thick dashed guide
    function renderDashedSVGGuide(letter) {
        svg.innerHTML = '';
        const strokes = letterPaths[letter] || [];
        const w = canvas.width;
        const h = canvas.height;

        currentStrokeSegments = strokes.map(stroke => {
            return stroke.map(pt => ({
                x: (pt.x / 100) * w,
                y: (pt.y / 100) * h
            }));
        });

        currentStrokeSegments.forEach(pts => {
            let pathD = `M ${pts[0].x} ${pts[0].y}`;
            for (let i = 1; i < pts.length; i++) {
                pathD += ` L ${pts[i].x} ${pts[i].y}`;
            }

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', pathD);
            path.setAttribute('stroke', '#333333');
            path.setAttribute('stroke-width', '16');
            path.setAttribute('stroke-dasharray', '18, 14');
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-linejoin', 'round');
            path.setAttribute('fill', 'none');
            path.setAttribute('opacity', '0.45');
            svg.appendChild(path);
        });
    }

    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    // Distance from point to line segment
    function projectOntoSegment(p, v, w) {
        const l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
        if (l2 === 0) return v;
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) };
    }

    // Smart Snapping: Find the closest guide stroke and lock to it
    function snapPoint(rawPt) {
        const SNAP_RADIUS = 55; // Snapping magnet reach (pixels)
        let closestPt = rawPt;
        let minDistance = Infinity;

        currentStrokeSegments.forEach(pts => {
            for (let i = 0; i < pts.length - 1; i++) {
                const projected = projectOntoSegment(rawPt, pts[i], pts[i+1]);
                const dist = Math.hypot(rawPt.x - projected.x, rawPt.y - projected.y);
                if (dist < minDistance && dist <= SNAP_RADIUS) {
                    minDistance = dist;
                    closestPt = projected;
                }
            }
        });

        return closestPt;
    }

    let lastSnapped = null;

    function onPointerDown(e) {
        isDrawing = true;
        const raw = getPointerPos(e);
        lastSnapped = snapPoint(raw);

        ctx.strokeStyle = '#4ECDC4';
        ctx.fillStyle = '#4ECDC4';
        ctx.lineWidth = 22;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.arc(lastSnapped.x, lastSnapped.y, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(lastSnapped.x, lastSnapped.y);
    }

    function onPointerMove(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const raw = getPointerPos(e);
        const snapped = snapPoint(raw);

        ctx.beginPath();
        ctx.moveTo(lastSnapped.x, lastSnapped.y);
        ctx.lineTo(snapped.x, snapped.y);
        ctx.stroke();

        lastSnapped = snapped;
    }

    function onPointerUp() {
        if (isDrawing) {
            isDrawing = false;
            // Short supportive cheer
            speak("Good job!");
        }
    }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    canvas.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    window.addEventListener('resize', () => {
        if (currentMode === 'tracing') {
            setupCanvas();
            renderDashedSVGGuide(String.fromCharCode(65 + traceIdx));
        }
    });
</script>
</body>
</html>
