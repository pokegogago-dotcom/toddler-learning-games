<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toddler Ultimate Academy</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F7FFF7;
            --text: #2F2F2F;
            --hint: rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none; /* Prevents scrolling while drawing */
        }

        #game-container {
            background: white;
            padding: 15px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 95%;
            max-width: 900px;
            height: 90vh;
            border: 8px solid var(--accent);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .hidden { display: none !important; }

        /* Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .menu-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 25px;
            border-radius: 20px;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 6px #38b2ac;
        }

        /* Drawing Canvas Area */
        #canvas-area {
            flex-grow: 1;
            position: relative;
            background: #fff;
            border: 4px dashed #ddd;
            border-radius: 20px;
            margin: 10px 0;
            cursor: crosshair;
        }

        #tracing-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #ghost-letter {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 25rem;
            color: #f0f0f0;
            font-weight: bold;
            user-select: none;
            z-index: 1;
        }

        .big-emoji { font-size: 5rem; margin: 0; }
        
        .controls {
            display: flex;
            justify-content: space-around;
            padding: 10px;
        }

        .btn-small {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: bold;
            height: 2rem;
        }

        /* Keyboard for Spelling Mode */
        .keyboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 5px;
            margin-top: 10px;
        }
        .key {
            padding: 10px 2px;
            font-size: 1rem;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        /* Bottom Word Slots */
        .word-slots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .slot {
            width: 40px;
            height: 50px;
            border-bottom: 4px solid #ddd;
            font-size: 2rem;
            font-weight: bold;
            color: var(--secondary);
        }
        .active-slot { border-bottom-color: var(--primary); background: #fffdf0; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Home Menu -->
        <div id="menu">
            <h1>🌈 Toddler Academy</h1>
            <div class="menu-grid">
                <button class="menu-btn" onclick="startMode('alphabet')">🅰️ Trace the Alphabet (A-Z)</button>
                <button class="menu-btn" style="background:#FF6B6B; box-shadow:0 6px #e65a5a" onclick="startMode('phonics')">🍎 Letter Sounds</button>
                <button class="menu-btn" style="background:#FFD93D; color:#333; box-shadow:0 6px #e6c235" onclick="startMode('spelling')">✍️ Spelling & Tracing</button>
            </div>
        </div>

        <!-- Game Interface -->
        <div id="game-play" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <div id="message">Trace the letter!</div>
            
            <div id="top-display">
                <div id="emoji-icon" class="big-emoji"></div>
                <div id="word-display" class="word-slots"></div>
            </div>

            <div id="canvas-area">
                <div id="ghost-letter">A</div>
                <canvas id="tracing-canvas"></canvas>
            </div>

            <div id="spelling-keyboard" class="keyboard hidden"></div>

            <div class="controls">
                <button class="btn-small" style="background:#999" onclick="location.reload()">🏠 Home</button>
                <button class="btn-small" onclick="clearCanvas()">🧼 Clear</button>
                <button class="btn-small" style="background:var(--secondary)" onclick="checkTrace()">✅ Done!</button>
            </div>
        </div>
    </div>

    <script>
        const library = [
            { w: 'CAT', e: '🐱' }, { w: 'DOG', e: '🐶' }, { w: 'SUN', e: '☀️' },
            { w: 'BED', e: '🛏️' }, { w: 'BOX', e: '📦' }, { w: 'ANT', e: '🐜' }
        ];

        let mode = '';
        let currentAlphaIndex = 0; // For A-Z mode
        let currentWordIndex = 0;  // For Spelling mode
        let currentLetterIndex = 0; // Which letter of the word we are tracing
        
        const canvas = document.getElementById('tracing-canvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        const synth = window.speechSynthesis;

        function speak(text) {
            if (synth.speaking) synth.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 0.8;
            synth.speak(u);
        }

        function startMode(m) {
            mode = m;
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game-play').classList.remove('hidden');
            
            // Resize canvas to fit
            const rect = document.getElementById('canvas-area').getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            if (mode === 'spelling') document.getElementById('spelling-keyboard').classList.remove('hidden');
            
            setupStage();
        }

        function setupStage() {
            clearCanvas();
            let letterToTrace = '';

            if (mode === 'alphabet') {
                letterToTrace = String.fromCharCode(65 + currentAlphaIndex);
                document.getElementById('emoji-icon').innerText = '🔤';
                document.getElementById('message').innerText = "Trace the letter!";
                speak("Trace the letter " + letterToTrace);
            } 
            else if (mode === 'phonics') {
                const data = library[currentWordIndex];
                letterToTrace = data.w[0];
                document.getElementById('emoji-icon').innerText = data.e;
                document.getElementById('message').innerText = `"${letterToTrace}" is for ${data.w}`;
                speak(`${letterToTrace} is for ${data.w}. Trace the ${letterToTrace}`);
            }
            else if (mode === 'spelling') {
                const data = library[currentWordIndex];
                letterToTrace = data.w[currentLetterIndex];
                document.getElementById('emoji-icon').innerText = data.e;
                renderWordSlots(data.w);
                document.getElementById('message').innerText = `Spell ${data.w}`;
                speak(`Trace the ${letterToTrace}`);
            }

            document.getElementById('ghost-letter').innerText = letterToTrace;
        }

        function renderWordSlots(word) {
            const container = document.getElementById('word-display');
            container.innerHTML = '';
            word.split('').forEach((char, i) => {
                const s = document.createElement('div');
                s.className = `slot ${i === currentLetterIndex ? 'active-slot' : ''}`;
                s.innerText = i < currentLetterIndex ? char : '';
                container.appendChild(s);
            });
        }

        // Canvas Drawing Logic
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) { drawing = true; draw(e); }
        function stopDrawing() { drawing = false; ctx.beginPath(); }
        
        function draw(e) {
            if (!drawing) return;
            const pos = getPos(e);
            ctx.lineWidth = 20;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#4ECDC4';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function checkTrace() {
            // In a real app, we would compare pixels, 
            // but for a toddler, we celebrate their effort!
            speak("Beautiful writing!");
            document.getElementById('message').innerText = "🌟 AMAZING! 🌟";
            
            setTimeout(() => {
                nextStep();
            }, 1500);
        }

        function nextStep() {
            if (mode === 'alphabet') {
                currentAlphaIndex = (currentAlphaIndex + 1) % 26;
            } 
            else if (mode === 'phonics') {
                currentWordIndex = (currentWordIndex + 1) % library.length;
            }
            else if (mode === 'spelling') {
                currentLetterIndex++;
                if (currentLetterIndex >= library[currentWordIndex].w.length) {
                    currentLetterIndex = 0;
                    currentWordIndex = (currentWordIndex + 1) % library.length;
                    speak("You spelled the whole word!");
                }
            }
            setupStage();
        }

        // Initialize Keyboard for Spelling
        const kb = document.getElementById('spelling-keyboard');
        "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(l => {
            const b = document.createElement('button');
            b.className = 'key';
            b.innerText = l;
            b.onclick = () => {
                const target = document.getElementById('ghost-letter').innerText;
                if (l === target) {
                    speak(l);
                    checkTrace();
                } else {
                    speak("Try to find " + target);
                }
            };
            kb.appendChild(b);
        });
    </script>
</body>
</html>
